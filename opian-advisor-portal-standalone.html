<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2a4a">
  <meta name="description" content="Standalone OPIAN advisor portal frontend preview.">
  <title>OPIAN NFS Group | Advisor Portal Preview</title>
  <style>
    :root {
      --navy: #1b2a4a;
      --navy-deep: #14213d;
      --navy-soft: #263b63;
      --gold: #c9a52a;
      --gold-light: #f4edcf;
      --cream: #f5f2e9;
      --paper: #fffefa;
      --ink: #1f2937;
      --muted: #778195;
      --line: #e5e7eb;
      --blue-wash: #eff6ff;
      --green: #16835d;
      --red: #b94a48;
      --shadow: 0 12px 32px rgba(27, 42, 74, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--cream);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--cream); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .app-shell { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 20; width: 244px;
      display: flex; flex-direction: column; background: var(--navy); color: white;
      box-shadow: 5px 0 24px rgba(17, 30, 54, .08);
    }
    .brand {
      height: 82px; display: flex; align-items: center; justify-content: center; gap: 11px;
      border-bottom: 1px solid rgba(255,255,255,.11); padding: 0 16px;
    }
    .brand-mark { width: 34px; height: 34px; flex: none; }
    .brand-word { font: 700 20px Georgia, "Times New Roman", serif; letter-spacing: .11em; line-height: 1; }
    .brand-sub { display: block; color: var(--gold); font: 700 9px Inter, sans-serif; letter-spacing: .24em; margin-top: 5px; }
    .portal-tag { margin: 14px 14px 5px; padding: 8px 11px; border: 1px solid rgba(255,255,255,.12); border-radius: 9px; background: rgba(255,255,255,.045); color: rgba(255,255,255,.58); font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .nav-list { overflow-y: auto; flex: 1; padding: 9px 12px 16px; }
    .nav-label { padding: 12px 11px 7px; color: rgba(255,255,255,.36); font-size: 9px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .nav-link {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; margin: 2px 0;
      border: 0; border-radius: 9px; color: rgba(255,255,255,.68); background: transparent;
      text-align: left; font-size: 13px; font-weight: 570; transition: .18s ease;
    }
    .nav-link:hover { background: rgba(255,255,255,.075); color: white; }
    .nav-link.active { background: var(--gold); color: var(--navy-deep); font-weight: 750; box-shadow: 0 5px 14px rgba(201,165,42,.18); }
    .nav-icon { width: 19px; text-align: center; font-size: 15px; }
    .sidebar-foot { border-top: 1px solid rgba(255,255,255,.11); padding: 13px 15px 16px; }
    .profile-mini { display: flex; align-items: center; gap: 10px; padding: 4px 5px 12px; }
    .avatar { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: rgba(201,165,42,.2); color: #f3d773; font-size: 12px; font-weight: 800; }
    .profile-mini strong { display: block; font-size: 12px; }
    .profile-mini small { display: block; color: rgba(255,255,255,.5); font-size: 10px; margin-top: 3px; }
    .signout { width: 100%; text-align: left; border: 0; color: rgba(255,255,255,.58); background: transparent; padding: 8px 6px; font-size: 12px; }
    .signout:hover { color: white; }
    .main-shell { min-height: 100vh; margin-left: 244px; }
    .topbar {
      height: 67px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; background: rgba(255,254,250,.94); border-bottom: 1px solid rgba(27,42,74,.08); backdrop-filter: blur(12px);
    }
    .top-left { display: flex; align-items: center; gap: 12px; }
    .mobile-menu { display: none; border: 0; border-radius: 8px; background: transparent; color: var(--navy); font-size: 21px; padding: 5px 8px; }
    .crumb { color: var(--muted); font-size: 12px; }
    .top-right { display: flex; align-items: center; gap: 14px; }
    .demo-pill { border: 1px solid #e9dfb9; color: #755f1a; background: #fbf7e7; padding: 6px 10px; border-radius: 999px; font-size: 10px; font-weight: 750; letter-spacing: .03em; }
    .top-avatar { width: 34px; height: 34px; border: 2px solid #e9ddb0; border-radius: 50%; display: grid; place-items: center; color: #836d22; background: #f9f3dc; font-size: 11px; font-weight: 800; }
    .notice {
      margin: 18px 32px 0; padding: 10px 13px; display: flex; gap: 9px; align-items: center;
      border: 1px solid #e8e0c4; border-radius: 9px; background: #fbf8ec; color: #796a36; font-size: 11px;
    }
    .page-content { padding: 26px 32px 48px; max-width: 1440px; margin: 0 auto; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin: 0 0 24px; }
    .page-heading h1 { color: var(--navy); font: 700 clamp(25px, 3vw, 32px) Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.02em; }
    .page-heading p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .eyebrow { color: #8d7c42; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 8px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 9px; padding: 10px 15px; background: var(--navy); color: white; font-size: 12px; font-weight: 700; transition: .17s ease; }
    .button:hover { background: var(--navy-soft); transform: translateY(-1px); }
    .button.gold { background: var(--gold); color: var(--navy-deep); }
    .button.gold:hover { background: #d7b743; }
    .button.outline { background: white; color: var(--navy); border-color: var(--line); }
    .button.outline:hover { border-color: #b8c0ce; background: #fafbfc; }
    .button.small { padding: 7px 10px; font-size: 11px; }
    .button.danger { color: var(--red); background: white; border-color: #edd5d5; }
    .button:disabled { opacity: .48; cursor: not-allowed; transform: none; }
    .grid { display: grid; gap: 17px; }
    .stats-grid { grid-template-columns: repeat(4, minmax(0,1fr)); margin-bottom: 23px; }
    .card { background: var(--paper); border: 1px solid rgba(27,42,74,.075); border-radius: 15px; box-shadow: var(--shadow); }
    .stat-card { padding: 20px; min-height: 135px; }
    .stat-top { display: flex; justify-content: space-between; align-items: center; }
    .stat-icon { width: 37px; height: 37px; display: grid; place-items: center; background: #f5efd9; color: #9a7d18; border-radius: 11px; font-size: 17px; }
    .stat-trend { color: var(--green); background: #eaf6ef; padding: 4px 7px; border-radius: 20px; font-size: 9px; font-weight: 750; }
    .stat-value { color: var(--navy); font: 700 27px Georgia, serif; margin-top: 14px; }
    .stat-label { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .dashboard-columns { grid-template-columns: minmax(0,1.65fr) minmax(270px,1fr); }
    .card-pad { padding: 22px; }
    .card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .card-title { color: var(--navy); font: 700 19px Georgia, serif; margin: 0; }
    .card-subtitle { color: var(--muted); font-size: 11px; margin-top: 5px; }
    .actions-list { display: grid; gap: 7px; }
    .action-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 13px; border: 1px solid transparent; border-radius: 10px; color: var(--navy); background: #faf9f5; cursor: pointer; transition: .16s ease; }
    .action-row:hover { border-color: #e7dfc3; background: #fbf8ec; transform: translateX(2px); }
    .action-row-left { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 650; }
    .action-row .mini-icon { width: 31px; height: 31px; border-radius: 8px; display: grid; place-items: center; background: white; color: #8d7622; font-size: 14px; box-shadow: 0 2px 8px rgba(27,42,74,.05); }
    .arrow { color: #a6adba; font-size: 17px; }
    .advisor-card { position: relative; overflow: hidden; color: white; background: var(--navy); }
    .advisor-card:after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; right: -75px; top: -90px; border: 24px solid rgba(201,165,42,.1); }
    .advisor-card .card-pad { position: relative; z-index: 1; }
    .advisor-kicker { color: #d4c17e; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .advisor-name { font: 700 24px Georgia, serif; margin: 10px 0 5px; }
    .advisor-title { color: #d1d8e4; font-size: 11px; }
    .advisor-meta { display: flex; align-items: center; gap: 11px; margin: 21px 0; color: #d7ddea; font-size: 11px; }
    .advisor-meta .avatar { width: 43px; height: 43px; background: rgba(201,165,42,.2); color: #f0d973; font-size: 14px; }
    .advisor-card .button { width: 100%; }
    .section-title { color: var(--navy); font: 700 20px Georgia, serif; margin: 27px 0 13px; }
    .services-grid { grid-template-columns: repeat(5,1fr); }
    .service-card { min-height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 11px; text-align: center; padding: 15px 10px; color: var(--navy); font-size: 11px; font-weight: 650; }
    .service-card span:first-child { font-size: 25px; }
    .service-card:hover { border-color: #d9c66f; transform: translateY(-2px); transition: .16s ease; }
    .table-wrap { overflow: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 700px; }
    th { background: #f7f6f1; color: #6e7787; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; font-weight: 800; text-align: left; padding: 12px 14px; white-space: nowrap; }
    td { border-top: 1px solid #edf0f3; color: #384153; font-size: 11px; padding: 13px 14px; vertical-align: middle; }
    tbody tr:hover { background: #fcfbf7; }
    .primary-cell { color: var(--navy); font-weight: 750; }
    .secondary-cell { color: var(--muted); display: block; font-size: 10px; font-weight: 450; margin-top: 3px; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 8px; font-size: 9px; font-weight: 750; text-transform: capitalize; white-space: nowrap; }
    .badge.green { color: #147248; background: #e8f5ec; }
    .badge.amber { color: #8a6b0a; background: #fbf3d4; }
    .badge.blue { color: #315ba4; background: #eaf1fc; }
    .badge.red { color: #a63c3c; background: #faeaea; }
    .badge.gray { color: #667085; background: #eef0f3; }
    .toolbar { display: flex; align-items: center; gap: 10px; }
    .search { width: min(260px, 100%); height: 39px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--ink); font-size: 12px; outline: none; }
    .search:focus, .control:focus, textarea:focus, select:focus { border-color: #c1a33a; box-shadow: 0 0 0 3px rgba(201,165,42,.12); outline: none; }
    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 17px 0; }
    .tabs { display: flex; gap: 5px; flex-wrap: wrap; }
    .tab { border: 1px solid var(--line); color: #657083; background: white; border-radius: 999px; padding: 7px 11px; font-size: 10px; font-weight: 650; }
    .tab.active { color: var(--navy); background: #f6f0d8; border-color: #e6d78e; }
    .appointment-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .appointment-card { padding: 18px; }
    .appointment-card h3 { color: var(--navy); font: 700 17px Georgia, serif; margin: 0; }
    .appointment-info { display: grid; gap: 9px; margin: 17px 0; color: #626d7f; font-size: 11px; }
    .appointment-info div { display: flex; align-items: center; gap: 8px; }
    .document-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .doc-card { padding: 18px; }
    .doc-icon { width: 43px; height: 43px; display: grid; place-items: center; background: #f1f4fa; border-radius: 12px; font-size: 21px; }
    .doc-card h3 { color: var(--navy); font-size: 13px; margin: 13px 0 4px; }
    .doc-card p { color: var(--muted); font-size: 10px; margin: 0; }
    .doc-card .doc-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .contact-grid { grid-template-columns: minmax(250px,.8fr) minmax(0,1.5fr); }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; color: #30394c; font-size: 10px; font-weight: 800; letter-spacing: .045em; margin: 0 0 6px; text-transform: uppercase; }
    .field-help { color: #78849a; font-size: 10px; line-height: 1.45; margin: -2px 0 6px; }
    .control { width: 100%; min-height: 41px; border: 1px solid #dfe3e9; border-radius: 7px; background: white; padding: 9px 11px; color: var(--ink); font-size: 12px; transition: .15s ease; }
    textarea.control { min-height: 116px; resize: vertical; }
    .prefix-wrap { display: flex; border: 1px solid #dfe3e9; background: white; border-radius: 7px; overflow: hidden; }
    .prefix { display: grid; place-items: center; min-width: 39px; color: #718096; background: #f7f7f5; border-right: 1px solid #e4e7eb; font-size: 11px; }
    .prefix-wrap .control { border: 0; border-radius: 0; }
    .empty-state { padding: 44px 20px; text-align: center; color: var(--muted); font-size: 12px; }
    .empty-state .empty-icon { font-size: 31px; margin-bottom: 10px; }
    .fna-shell { max-width: 820px; margin: 0 auto; }
    .fna-head { text-align: center; margin: 5px 0 21px; }
    .fna-head .eyebrow { margin-bottom: 6px; }
    .fna-head h2 { color: var(--navy); font: 700 25px Georgia, serif; margin: 0; }
    .fna-head p { color: var(--muted); font-size: 12px; margin: 7px 0 0; }
    .fna-progress-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; color: var(--muted); font-size: 10px; margin: 0 0 8px; }
    .fna-progress-top strong { color: var(--navy); font-size: 12px; }
    .fna-progress-top span:last-child { text-align: right; }
    .progress-track { height: 4px; background: #e6e8ec; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
    .progress-fill { height: 100%; background: var(--navy); border-radius: 999px; transition: width .25s ease; }
    .fna-steps { display: grid; grid-template-columns: repeat(8,minmax(62px,1fr)); gap: 3px; overflow-x: auto; margin-bottom: 13px; padding-bottom: 2px; }
    .fna-step { position: relative; min-width: 61px; border: 0; border-bottom: 2px solid transparent; color: #929bae; background: transparent; padding: 7px 3px 8px; text-align: center; font-size: 9px; line-height: 1.3; }
    .fna-step .step-emoji { display: block; margin-bottom: 4px; font-size: 16px; }
    .fna-step.active { border-color: var(--navy); color: var(--navy); font-weight: 750; }
    .fna-step.done { color: #a58b2d; }
    .fna-card { padding: 25px 28px; border-radius: 0 0 15px 15px; }
    .fna-card-title { display: flex; align-items: flex-start; gap: 12px; margin: 0 0 20px; }
    .fna-card-title .step-emoji { font-size: 22px; }
    .fna-card-title h3 { color: var(--navy); font: 700 20px Georgia, serif; margin: 0; }
    .fna-card-title p { color: #667085; font-size: 11px; margin: 5px 0 0; }
    .fna-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 13px 17px; }
    .fna-error { display: none; margin: 0 0 14px; border: 1px solid #f0caca; background: #fff3f2; color: #a13f3f; padding: 10px 12px; border-radius: 8px; font-size: 11px; }
    .option-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid #dfe3e9; border-radius: 999px; background: white; color: #4c566a; padding: 9px 13px; font-size: 11px; font-weight: 650; }
    .chip.selected { color: var(--navy); border-color: var(--gold); background: #fbf7e8; }
    .risk-option { width: 100%; text-align: left; border: 1px solid #e1e4e8; border-radius: 10px; background: white; padding: 13px 15px; color: #394358; margin-bottom: 8px; }
    .risk-option strong { display: block; color: var(--navy); font-size: 12px; }
    .risk-option small { display: block; color: var(--muted); margin-top: 4px; font-size: 10px; }
    .risk-option.selected { background: #f5f7fb; border-color: var(--navy); box-shadow: inset 3px 0 var(--gold); }
    .checks-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .check-option { display: flex; align-items: center; gap: 9px; border: 1px solid #e2e5ea; border-radius: 9px; padding: 10px; color: #485267; background: white; font-size: 11px; }
    .check-option input { accent-color: var(--gold); }
    .result-banner { padding: 19px; color: white; background: var(--navy); border-radius: 12px; display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .result-banner small, .result-dark small { display: block; color: rgba(255,255,255,.62); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
    .result-banner strong { display: block; margin-top: 6px; color: var(--gold); font: 700 18px Georgia,serif; }
    .result-panel { padding: 17px; }
    .result-panel h4 { color: var(--navy); font: 700 16px Georgia,serif; margin: 0 0 14px; }
    .result-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #edf0f3; font-size: 10px; }
    .result-row strong { color: var(--navy); }
    .result-row .gap { color: #a44845; font-weight: 750; text-align: right; }
    .result-row .covered { color: var(--green); text-align: right; font-weight: 750; }
    .result-dark { padding: 17px; color: white; background: var(--navy); }
    .result-dark strong { display: block; margin-top: 6px; color: var(--gold); font: 700 22px Georgia,serif; }
    .results-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; }
    .result-mini { padding: 14px; }
    .result-mini small { color: var(--muted); display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
    .result-mini strong { display: block; color: var(--navy); font: 700 17px Georgia,serif; margin-top: 6px; }
    .settings-group { margin-bottom: 16px; }
    .toggle-line { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-top: 1px solid #edf0f3; }
    .toggle-line strong { display: block; color: var(--navy); font-size: 12px; }
    .toggle-line small { display: block; color: var(--muted); margin-top: 4px; font-size: 10px; }
    .toggle-line input { width: 18px; height: 18px; accent-color: var(--gold); }
    .modal-backdrop { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; z-index: 50; background: rgba(12,22,40,.5); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(530px,100%); max-height: 90vh; overflow: auto; padding: 23px; background: var(--paper); border-radius: 15px; box-shadow: 0 24px 70px rgba(0,0,0,.25); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 17px; }
    .modal-head h2 { color: var(--navy); font: 700 21px Georgia,serif; margin: 0; }
    .close-btn { border: 0; border-radius: 8px; width: 31px; height: 31px; background: #f1f2f4; color: #515b6b; font-size: 19px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
    .toast { position: fixed; z-index: 80; right: 20px; bottom: 20px; max-width: min(390px,calc(100vw - 40px)); display: none; padding: 13px 16px; border-radius: 10px; background: var(--navy); color: white; box-shadow: 0 12px 35px rgba(17,30,54,.25); font-size: 12px; }
    .toast.show { display: block; animation: slide-in .2s ease-out; }
    @keyframes slide-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-scrim { display: none; }
    @media (max-width: 1060px) {
      .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .dashboard-columns { grid-template-columns: 1fr; }
      .appointment-grid, .document-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 760px) {
      .sidebar { transform: translateX(-100%); transition: transform .22s ease; }
      .sidebar.open { transform: translateX(0); }
      .mobile-scrim.open { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(12,22,40,.4); }
      .main-shell { margin-left: 0; }
      .mobile-menu { display: inline-grid; place-items: center; }
      .topbar { height: 59px; padding: 0 15px; }
      .notice { margin: 12px 14px 0; align-items: flex-start; line-height: 1.4; }
      .page-content { padding: 21px 14px 35px; }
      .page-heading { align-items: flex-start; flex-direction: column; margin-bottom: 19px; }
      .stats-grid { gap: 10px; }
      .stat-card { min-height: 119px; padding: 15px; }
      .stat-value { font-size: 23px; }
      .services-grid { grid-template-columns: repeat(2,1fr); }
      .appointment-grid, .document-grid { grid-template-columns: 1fr; }
      .contact-grid { grid-template-columns: 1fr; }
      .fna-card { padding: 19px 15px; }
      .fna-steps { grid-template-columns: repeat(8,68px); }
      .fna-controls { padding: 11px; }
      .form-grid { gap: 12px; }
      .toolbar { width: 100%; }
      .search { width: 100%; }
      .filter-row { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 460px) {
      .form-grid { grid-template-columns: 1fr; }

    };
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    const state = {

      return `<div class="page-heading"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`;
    }

      return `<div class="card-title-row"><div><h2 class="card-title">${title}</h2>${subtitle ? `<div class="card-subtitle">${subtitle}</div>` : ""}</div>${action}</div>`;
    }
    function badge(status) {
      const value = String(status).toLowerCase();
      const cls = value.includes("active") || value.includes("available") || value.includes("completed") ? "green" :
        value.includes("pending") || value.includes("new") || value.includes("follow") ? "amber" :
        value.includes("scheduled") || value.includes("reviewed") || value.includes("contacted") ? "blue" :
        value.includes("cancel") ? "red" : "gray";
      return `<span class="badge ${cls}">${esc(status)}</span>`;
    }
    function stat(label, value, icon, trend="Sample") {
      return `<article class="card stat-card"><div class="stat-top"><div class="stat-icon">${icon}</div><span class="stat-trend">${trend}</span></div><div class="stat-value">${value}</div><div class="stat-label">${label}</div></article>`;
    }
    function renderDashboard() {
      const actions = [

        ["▧","Start a Financial Needs Analysis","fna"],["✉","Contact My Adviser","contact"]
      ];

          </article>
          <article class="card advisor-card"><div class="card-pad">
            <div class="advisor-kicker">Your Adviser</div><div class="advisor-name">Lance Heynes CFP®</div>

          </div></article>

    }
    function renderAppointmentTable(rows, actions=true) {
      if (!rows.length) return `<div class="empty-state"><div class="empty-icon">▦</div>No appointments found.</div>`;

    function calcResults() {
      const d=state.fna, n=Number;
      const debts=n(d.homeLoans)+n(d.vehicleFinance)+n(d.personalLoans)+n(d.creditCards)+n(d.otherDebts);
      const assets=n(d.savings)+n(d.investments)+n(d.retirementFunds)+n(d.propertyValue);
      const net=n(d.netMonthlyIncome)||n(d.grossMonthlyIncome)*.75;
      const years=Math.max(1,n(d.targetRetirementAge)-(n(d.currentAge)||35));
      const lifeNeed=net*12*(n(d.dependants)>0?15:10)+debts+n(d.dependants)*250000;
      const lifeGap=Math.max(0,lifeNeed-n(d.existingLifeCover));
      const disabilityNeed=(n(d.grossMonthlyIncome)||net/.75)*.75*12*years;
      const disabilityGap=Math.max(0,disabilityNeed-n(d.existingDisabilityCover));
      const dreadNeed=net*12*4+500000;
      const dreadGap=Math.max(0,dreadNeed-n(d.existingDreadDiseaseCover));
      const corpus=(n(d.monthlyRetirementIncome)||net*.75)*12/.06*Math.pow(1.06,years);
      const futureSavings=(n(d.currentRetirementSavings)||n(d.retirementFunds))*Math.pow(1.1,years);
      const retirementShortfall=Math.max(0,corpus-futureSavings);
      const rate=.1/12, months=years*12;
      const contribution=retirementShortfall>0?retirementShortfall*rate/(Math.pow(1+rate,months)-1):0;
      const emergencyTarget=net*6;
      const emergencyGap=Math.max(0,emergencyTarget-n(d.savings));
      const smoker=n=>d.smoker==="yes"?1.4:1;
      const gender=d.gender==="female"?.85:1;
      const lifePremium=lifeGap>0?lifeGap/1000*1.2*smoker()*gender:0;
      const disabilityPremium=disabilityGap>0?net*.75*.035:0;
      const dreadPremium=dreadGap>0?dreadGap/1000*1.8*smoker():0;
      const totalRecommendedPremium=lifePremium+disabilityPremium+dreadPremium+contribution;
      return { debts,assets,net,years,lifeNeed,lifeGap,disabilityNeed,disabilityGap,dreadNeed,dreadGap,corpus,retirementShortfall,contribution,emergencyTarget,emergencyGap,totalRecommendedPremium,affordabilityRatio:net>0?totalRecommendedPremium/net:0,netWorth:assets-debts };
    }

        </div>
        <div class="card result-panel" style="margin-bottom:12px"><h4>🎯 Retirement Planning</h4><div class="results-grid"><div class="result-mini"><small>Corpus Needed</small><strong>${money(c.corpus)}</strong></div><div class="result-mini"><small>Projected Shortfall</small><strong style="color:${c.retirementShortfall>0?"#a26b12":"#16835d"}">${c.retirementShortfall>0?money(c.retirementShortfall):"On track"}</strong></div><div class="result-mini"><small>Years to Retirement</small><strong>${c.years}</strong></div><div class="result-mini"><small>Suggested Monthly Contribution</small><strong>${money(c.contribution)}</strong></div></div></div>

    function validateFnaStep() {
      const d=state.fna, step=state.fnaStep, errors=[];
      if(step===0) {
        if(!d.firstName.trim()) errors.push("First name is required.");
        if(!d.lastName.trim()) errors.push("Last name is required.");
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) errors.push("Enter a valid email address.");
        if(d.phone.replace(/\D/g,"").length<10) errors.push("Enter a valid phone number.");
        if(!d.dob) errors.push("Date of birth is required.");
        if(!d.gender) errors.push("Select a gender.");
        if(!d.smoker) errors.push("Select smoker status.");
        if(!d.maritalStatus) errors.push("Select marital status.");
      }
      if(step===1) {
        if(!d.employmentType) errors.push("Select your employment type.");
        if(Number(d.grossMonthlyIncome)<=0) errors.push("Enter a gross monthly income greater than zero.");
      }
      if(step===2 && Number(d.monthlyExpenses)<=0) errors.push("Enter total monthly household expenses.");
      if(step===5 && !d.riskProfile) errors.push("Select a risk appetite.");
      return errors;
    }
    function setFnaValue(key,value) {

      state.fna[key]=value;
      if(key==="dob" && value) {

        if(age>=0&&age<125) state.fna.currentAge=age;

          closeModal();render();toast("Document name added for this session. The file was not uploaded.");

      if(event.target.id==="contactForm"){event.preventDefault();event.target.reset();toast("Preview only: this message was not sent.");}
      if(event.target.id==="settingsForm"){event.preventDefault();toast("Settings updated for this screen only.");}
      if(event.target.id==="appointmentForm"||event.target.id==="leadForm")event.preventDefault();
    });
    document.getElementById("mobileMenu").addEventListener("click",()=>{document.getElementById("sidebar").classList.toggle("open");document.getElementById("scrim").classList.toggle("open");});
    document.getElementById("scrim").addEventListener("click",()=>{document.getElementById("sidebar").classList.remove("open");document.getElementById("scrim").classList.remove("open");});
    document.getElementById("modalBackdrop").addEventListener("click",event=>{if(event.target.id==="modalBackdrop")closeModal();});
    document.getElementById("signout").addEventListener("click",()=>toast("This is a frontend preview; no account session is active."));
    render();
  </script>
</body>
</html>
